<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eixos lineares · visão geral</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="wf.css">
<style>
/* Cover, after the reference hero: collage band on top, then two columns.
   Left: small subtitle at the top, mono byline at the bottom. Right: big title at the top, "Role para ler" along the bottom. */
.hero { height: max(600px, calc(100svh - 56px - var(--bar-h))); display: grid; grid-template-rows: 54% minmax(0, 1fr); }
.collage { position: relative; background: var(--field-b); overflow: hidden; }
.collage .ph { position: absolute; min-height: 0; border: 1px solid var(--paper); }
.collage .t1 { left: 5%; top: 29%; width: 18%; height: 71%; }
.collage .t2 { left: 31%; top: 0; width: 11.5%; height: 40%; }
.collage .t3 { left: 49.5%; top: 13%; width: 25.5%; height: 87%; }
.collage .t4 { left: 76%; top: 0; width: 17%; height: 35%; }
.collage .t5 { left: 89.5%; top: 46%; width: 10.5%; height: 37%; }
.collage .tag { position: absolute; z-index: 2; background: var(--paper); padding: 2px 6px; font-size: 10px; }
.collage .ph span { font-size: 10px; }
.cover-text { display: grid; gap: 20px; padding-block: 16px 24px; }
.cover-text .sub { margin: 0; font-size: 20px; line-height: 1.3; letter-spacing: -0.02em; max-width: 24ch; }
.cover-text h1 { margin: 0; font-size: clamp(50px, 8.4vw, 120px); font-weight: 700; line-height: .95; letter-spacing: -0.06em; text-wrap: balance; }
.cover-text .scroll { display: flex; justify-content: space-between; align-items: center; font-size: 18px; letter-spacing: -0.02em; text-decoration: none; }
@media (min-width: 900px) {
  .cover-text { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr auto; column-gap: 24px; }
  .cover-text .sub { grid-column: 1; grid-row: 1; }
  .cover-text h1 { grid-column: 2; grid-row: 1; }
  .cover-text .by { grid-column: 1; grid-row: 2; align-self: end; }
  .cover-text .scroll { grid-column: 2; grid-row: 2; }
}

/* Axis covers: each one sticks under the nav and the next slides over it, as in the reference.
   Phones too, at Alice's request (2026-10-09), though the reference stacks them plainly on mobile. */
.chapter:nth-child(3n+1) { background: var(--field-a); }
.chapter:nth-child(3n+2) { background: var(--field-b); }
.chapter:nth-child(3n) { background: var(--field-c); }
.chapter { position: sticky; top: calc(var(--bar-h) + 56px); min-height: calc(100svh - var(--bar-h) - 56px); }
@media (min-width: 900px) { .chapter { height: calc(100vh - var(--bar-h) - 56px); overflow: hidden; } }
</style>
</head>
<body>
<main>
  <section class="hero" aria-label="Capa">
    <div class="collage" aria-hidden="true">
      <div class="ph t1"><span>Imagem</span></div>
      <div class="ph t2"><span>Imagem</span></div>
      <div class="ph t3"><span>Vídeo</span></div>
      <div class="ph t4"><span>Imagem</span></div>
      <div class="ph t5"><span>Imagem</span></div>
    </div>
    <div class="cover-text wrap">
      <p class="sub">No dia 25 de outubro teremos que escolher entre duas opções</p>
      <h1>Quem é mais antissemita?</h1>
      <span class="by mono">Feito por e para judeus brasileiros</span>
      <a class="scroll" href="#cap-i"><span>Role para ler</span><span aria-hidden="true">↓</span></a>
    </div>
  </section>

  <div id="chapters"></div>
</main>

<footer class="site">
  <div class="wordmark">LOGO</div>
</footer>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
mountChrome("home");
const C = window.CHAPTERS;

document.getElementById("chapters").append(...C.map((c, i) =>
  el("section", { class: "chapter cover", id: "cap-" + c.id, "aria-label": "Eixo " + chapterNum(i) },
    buildCover(c, i, { rows: 5, cta: true }))
));
// A cover taller than the screen sticks only once its bottom reaches the bottom of the screen,
// so the whole card is read before the next one slides over it.
function pinCovers() {
  const navBottom = document.querySelector(".nav").getBoundingClientRect().height + document.querySelector(".wf-bar").offsetHeight;
  document.querySelectorAll(".chapter").forEach(c => { c.style.top = Math.min(navBottom, innerHeight - c.offsetHeight) + "px"; });
}
pinCovers();
addEventListener("resize", pinCovers);
document.fonts?.ready.then(pinCovers);
if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script>
</body>
</html>
