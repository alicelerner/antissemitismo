<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!--
  Phone frame for post B (1080 x 1440): a generic phone, no brand, centred. Opaque everywhere except the screen
  below the status bar, which stays transparent so the recording shows through when ffmpeg lays this PNG over it.
  Query string: ?w=600&bg=b4caf0&ch=1440 (phone width, background hex, canvas height: 1440 feed, 1920 stories). The site's viewport is 390 x 800 under a 44 px bar.
  The status bar is --tinta with white text: it continues the site's dark bar and meets the dark episode modal.
-->
<style>
  :root { --bg: #b4caf0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: var(--ch, 1440px); background: transparent; overflow: hidden; }
  .phone { position: absolute; left: var(--x); top: var(--y); width: var(--w); border-radius: calc(var(--w) * .172);
    background: #0d111b; padding: var(--bezel);
    box-shadow: inset 0 0 0 2px #2a3040; }
  /* The mask on .phone would clip an outer shadow, so the shadow lives on its own box behind it. */
  .phone-shadow { position: absolute; left: var(--x); top: var(--y); width: var(--w); height: var(--total);
    border-radius: calc(var(--w) * .172); box-shadow: 0 50px 100px -40px rgba(7, 18, 46, .55); }
  /* The page colour comes from the hole's spread shadow: background everywhere except the screen. */
  .phone__screen { position: relative; border-radius: calc(var(--w) * .14); overflow: hidden; }
  .phone__status { height: var(--status); background: #07122e; display: flex; align-items: center; justify-content: space-between;
    padding: calc(var(--status) * .14) calc(var(--w) * .09) 0 calc(var(--w) * .095);
    font: 600 calc(var(--status) * .37)/1 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; color: #fff; }
  .phone__island { position: absolute; top: calc(var(--status) * .22); left: 50%; width: calc(var(--w) * .27); height: calc(var(--status) * .72);
    transform: translateX(-50%); border-radius: 999px; background: #000; }
  .phone__icons { display: flex; gap: calc(var(--w) * .014); align-items: center; }
  .phone__icons svg { height: calc(var(--status) * .29); fill: currentColor; }
  .phone__hole { height: var(--h); }
  .page { position: absolute; inset: 0; background: var(--bg); }
</style>
</head>
<body>
  <div class="page" id="page"></div>
  <div class="phone-shadow" id="shadow"></div>
  <div class="phone" id="phone">
    <div class="phone__screen">
      <div class="phone__status">
        <span>9:41</span>
        <span class="phone__icons">
          <svg viewBox="0 0 18 11"><rect x="0" y="7" width="3" height="4" rx=".7"/><rect x="5" y="5" width="3" height="6" rx=".7"/><rect x="10" y="2.5" width="3" height="8.5" rx=".7"/><rect x="15" y="0" width="3" height="11" rx=".7"/></svg>
          <svg viewBox="0 0 16 11"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4 10.4 10.4 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.3A7 7 0 0 0 8 3.8a7 7 0 0 0-4.8 1.9L4.4 7c1-.9 2.2-1.4 3.6-1.4zm0 3.3c.5 0 1 .2 1.3.5L8 10.8 6.7 9.4c.3-.3.8-.5 1.3-.5z"/></svg>
          <svg viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="19" height="8" rx="1.8"/><rect x="23.5" y="4" width="1.8" height="4" rx=".9" opacity=".45"/></svg>
        </span>
      </div>
      <div class="phone__island"></div>
      <div class="phone__hole"></div>
    </div>
  </div>
<script>
  // The screen hole is cut by painting the page background in four rects around it, measured after layout,
  // because the phone body itself must stay opaque around the screen's rounded corners.
  const q = new URLSearchParams(location.search);
  const w = +(q.get("w") || 600), bezel = Math.round(w * .02), sw = w - 2 * bezel;
  const status = sw * 44 / 390, h = sw * 800 / 390;
  const root = document.documentElement.style;
  const ch = +(q.get("ch") || 1440);
  root.setProperty("--ch", ch + "px");
  if (q.get("bg")) root.setProperty("--bg", "#" + q.get("bg"));
  const s = document.body.style;
  s.setProperty("--w", w + "px"); s.setProperty("--bezel", bezel + "px");
  s.setProperty("--status", status + "px"); s.setProperty("--h", h + "px");
  const total = h + status + 2 * bezel;
  s.setProperty("--x", (1080 - w) / 2 + "px"); s.setProperty("--y", Math.round((ch - total) / 2) + "px");
  // Transparent hole: clear the screen area below the status bar with a mask on the phone body.
  s.setProperty("--total", total + "px");
  const x0 = bezel, y0 = bezel + status, r = w * .14; // the screen's corner radius
  const phone = document.getElementById("phone");
  const mask = `<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${total}'><defs><mask id='m'><rect width='100%' height='100%' fill='white'/><path d='M${x0} ${y0}h${sw}v${h - r}a${r} ${r} 0 0 1 -${r} ${r}h-${sw - 2 * r}a${r} ${r} 0 0 1 -${r} -${r}z' fill='black'/></mask></defs><rect width='100%' height='100%' mask='url(#m)'/></svg>`;
  phone.style.webkitMaskImage = phone.style.maskImage = `url("data:image/svg+xml,${encodeURIComponent(mask)}")`;
  // Same hole in the background layer.
  const page = document.getElementById("page");
  const pmask = `<svg xmlns='http://www.w3.org/2000/svg' width='1080' height='${ch}'><defs><mask id='m'><rect width='100%' height='100%' fill='white'/><path transform='translate(${(1080 - w) / 2} ${Math.round((ch - total) / 2)})' d='M${x0} ${y0}h${sw}v${h - r}a${r} ${r} 0 0 1 -${r} ${r}h-${sw - 2 * r}a${r} ${r} 0 0 1 -${r} -${r}z' fill='black'/></mask></defs><rect width='100%' height='100%' mask='url(#m)'/></svg>`;
  page.style.webkitMaskImage = page.style.maskImage = `url("data:image/svg+xml,${encodeURIComponent(pmask)}")`;
  window.geometry = { x: (1080 - w) / 2 + x0, y: Math.round((ch - total) / 2) + y0, w: sw, h };
</script>
</body>
</html>
